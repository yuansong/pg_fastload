name: Build with Ubuntu packages

# Compile check on every supported major.  PostgreSQL 14 and older are not in
# the matrix on purpose: include/pg_fastload.h rejects them with #error, so the
# job would fail by design.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        PGVERSION:
          - "18"
          - "17"
          - "16"
          - "15"

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.PGVERSION }} build dependencies
        shell: bash -xe {0}
        run: |
          # apt-key was removed in Ubuntu 24.04; the key is now pinned per
          # repository with signed-by.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # libselinux-dev does not exist on noble; the package is libselinux1-dev.
          sudo apt-get -y install \
            build-essential \
            libpam-dev \
            libkrb5-dev \
            libssl-dev \
            libreadline-dev \
            libselinux1-dev \
            libedit-dev \
            liblz4-dev \
            libnuma-dev \
            zlib1g-dev \
            postgresql-${{ matrix.PGVERSION }} \
            postgresql-server-dev-${{ matrix.PGVERSION }}

      - name: make (compile only — the functional suites run in the Test workflow)
        shell: bash -xe {0}
        run: |
          LOGFILE=~/make.log
          make PG_CONFIG=/usr/lib/postgresql/${{ matrix.PGVERSION }}/bin/pg_config 2>&1 | tee $LOGFILE

      - name: show build warnings
        shell: bash -xe {0}
        run: |
          grep -C 1 warning ~/make.log || exit 0

      - name: check the client version string
        shell: bash -xe {0}
        run: bin/pg_fastload --version
