name: Test

# Functional regression suite (pg_regress) on every supported major.
#
# PostgreSQL 14 and older are deliberately absent from the matrix:
# include/pg_fastload.h rejects them with #error, so a 14 job can only ever
# fail.  The supported range is 15 through 19; 19 is not in this matrix
# because there is no Ubuntu package / stable tarball for it yet.
#
# Two properties this file relies on, both fixes for a silently red workflow:
#
#   * pipefail: `make ... 2>&1 | tee $LOGFILE` reports the status of tee, not
#     of make.  Without pipefail a compile error is swallowed and only shows
#     up later as a confusing "could not open extension control file" in
#     installcheck.  Every step that pipes into tee therefore runs with
#     `bash -xeo pipefail`.
#   * fail-fast: false: with fail-fast enabled (the default) one bad major
#     cancels the remaining jobs, so the majors that would have passed never
#     report and the failure looks bigger than it is.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        PGVERSION:
          - "18.1"
          - "17.7"
          - "16.11"
          - "15.15"

    env:
      # Bump this to rebuild PostgreSQL instead of restoring ~/pgsql/<ver>.
      # The cached tree is a compiled install, so it has to match the runner
      # image: when GitHub rolls a new ubuntu-latest the old binaries can stop
      # running and every job fails within seconds, before any log is written.
      CACHE_VERSION: 20261117  # to identify cache version

    steps:
    - uses: actions/checkout@v4

    - name: cat version
      shell: bash -xeo pipefail {0}
      run: |
         cat /etc/os-release
         uname -a

    - name: get current branch name
      shell: bash -xeo pipefail {0}
      run: |
        if [ ${{ github.event_name }} = "pull_request" ]; then
          echo "BRANCH=${{ github.base_ref }}" >>  $GITHUB_ENV
        else # push
          echo "BRANCH=${GITHUB_REF##*/}" >>  $GITHUB_ENV
        fi

    - name: set build postgresql version
      shell: bash -xeo pipefail {0}
      run: |
        echo "PGVERSION=${{ matrix.PGVERSION }}" >> $GITHUB_ENV

    - name: cache builded resources
      id: cache-postgresql-core
      uses: actions/cache@v4
      with:
        path: "~/pgsql/${{ env.PGVERSION }}"
        key: ${{ env.PGVERSION }}-${{ env.CACHE_VERSION }}

    - name: build postgresql
      if: steps.cache-postgresql-core.outputs.cache-hit != 'true'
      shell: bash -xeo pipefail {0}
      run: |
        # set environment variables
        export PGHOME=~/pgsql/${{ env.PGVERSION }}

        # install
        sudo apt-get update -qq
        sudo apt-get -y install bc libpam-dev libedit-dev
        wget -q https://ftp.postgresql.org/pub/source/v${{ env.PGVERSION }}/postgresql-${{ env.PGVERSION }}.tar.gz
        tar xzf postgresql-${{ env.PGVERSION }}.tar.gz

        cd postgresql-${{ env.PGVERSION }}
        ./configure --prefix=$PGHOME --enable-cassert

        gcc -v
        LOGFILE=~/make.log
        make -j 4 2>&1 | tee $LOGFILE
        make install 2>&1 | tee -a $LOGFILE

    - name: show build warning
      if: steps.cache-postgresql-core.outputs.cache-hit != 'true'
      shell: bash -xeo pipefail {0}
      run: |
        LOGFILE=~/make.log
        grep -C 1 warning $LOGFILE || exit 0     # ok if warning doesn't exists (= status code is 1)

    - name: create database directory
      shell: bash -xeo pipefail {0}
      run: |
        export PGHOME=~/pgsql/${{ env.PGVERSION }}
        export PGDATA=~/pgdata/${{ env.PGVERSION }}
        export ARCHIVEDIR=~/pgdata/arc
        export PATH=$PGHOME/bin:$PATH:

        mkdir -p $PGDATA
        initdb --no-locale -D $PGDATA
        echo "local   all         postgres                          trust" > $PGDATA/pg_hba.conf
        echo "local   all         all                               trust" >> $PGDATA/pg_hba.conf
        echo "host    all         all         127.0.0.1/32          trust" >> $PGDATA/pg_hba.conf
        echo "host    all         all         ::1/128               trust" >> $PGDATA/pg_hba.conf
        echo "wal_level = hot_standby" >> $PGDATA/postgresql.conf                 # mapped to "replica" from PG9.6
        echo "archive_mode = on" >> $PGDATA/postgresql.conf
        echo "archive_command = 'cp %p $ARCHIVEDIR/%f'" >> $PGDATA/postgresql.conf
        pg_ctl -V
        pg_ctl -D $PGDATA -l $PGDATA/server.log start

    - name: show postgresql configuration
      shell: bash -xeo pipefail {0}
      run: |
        export PGHOME=~/pgsql/${{ env.PGVERSION }}
        export PGDATA=~/pgdata/${{ env.PGVERSION }}
        export PATH=$PGHOME/bin:$PATH:
        pg_config --version
        cat $PGDATA/postgresql.conf

    - name: make install
      shell: bash -xeo pipefail {0}
      run: |
        export PGHOME=~/pgsql/${{ env.PGVERSION }}
        export PATH=$PGHOME/bin:$PATH:
        LOGFILE=~/make.log
        make install 2>&1 | tee $LOGFILE

    - name: show build warning
      shell: bash -xeo pipefail {0}
      run: |
        LOGFILE=~/make.log
        grep -C 1 warning $LOGFILE || exit 0     # ok if warning doesn't exists (= status code is 1)

    - name: make installcheck
      shell: bash -xeo pipefail {0}
      run: |
        export PGHOME=~/pgsql/${{ env.PGVERSION }}
        export PATH=$PGHOME/bin:$PATH:
        make installcheck 2>&1 | tee ~/installcheck.log

    - name: publish the regression diff on failure
      if: failure()
      shell: bash -xeo pipefail {0}
      run: |
        # The job log needs repository admin rights to read, so the diagnostic
        # is published twice through channels that stay readable:
        #   * the run summary (rendered on the run page), and
        #   * workflow-command annotations, which the check-runs API exposes.
        # The second one is what makes a red CI debuggable from a script.
        DIFF=bin/regression.diffs
        LOG=~/installcheck.log

        {
          echo "### PostgreSQL ${{ env.PGVERSION }}"
          echo '```'
          if [ -f "$LOG" ]; then tail -25 "$LOG"; else echo "(no installcheck log)"; fi
          echo '```'
          echo '```diff'
          if [ -f "$DIFF" ]; then sed -n '1,200p' "$DIFF"; else echo "(no $DIFF produced)"; fi
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -f "$LOG" ]; then
          echo "::error::$(tail -20 "$LOG" | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"
        fi
        if [ -f "$DIFF" ]; then
          echo "::error::$(sed -n '1,60p' "$DIFF" | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"
        fi

        # When a step before installcheck fails there is no installcheck log and
        # no diff, so the only witness is the make log.  Emit its error lines as
        # an annotation (short enough to survive) and the rest to the summary.
        MK=~/make.log
        PGCONF=~/pgsql/${{ env.PGVERSION }}/bin/pg_config
        {
          echo "### PostgreSQL ${{ env.PGVERSION }} environment"
          echo '```'
          echo "PGVERSION=${{ env.PGVERSION }}"
          echo "pg_config: $PGCONF"
          if [ -x "$PGCONF" ]; then "$PGCONF" --version || echo "(pg_config failed to run)"; else echo "(missing or not executable)"; fi
          ls ~/pgdata 2>/dev/null || echo "(no ~/pgdata)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -f "$MK" ]; then
          {
            echo "### PostgreSQL ${{ env.PGVERSION }} make log (errors)"
            echo '```'
            grep -nE "error:|Error [0-9]|\*\*\*|undefined reference|No such file" "$MK" | tail -40 || echo "(no error lines)"
            echo '```'
            echo "### PostgreSQL ${{ env.PGVERSION }} make log (tail)"
            echo '```'
            tail -30 "$MK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Keep this under roughly a thousand characters: a workflow command is
          # one line and GitHub truncates long ones.
          echo "::error::$(grep -E "error:|Error [0-9]|\*\*\*|undefined reference|No such file" "$MK" | tail -8 | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"
        fi

        # A crashed backend leaves the reason only in the server log, and the
        # job log is not readable without admin rights.  The tail goes into the
        # run summary, where newlines survive; the annotation carries only the
        # crash markers, because a workflow command is a single long line and
        # GitHub truncates it, which is how the first diagnosis of the
        # write_bin crash lost the interesting part.
        SRV=~/pgdata/${{ env.PGVERSION }}/server.log
        if [ -f "$SRV" ]; then
          {
            echo "### PostgreSQL ${{ env.PGVERSION }} server log (tail)"
            echo '```'
            tail -80 "$SRV"
            echo '```'
            echo "### PostgreSQL ${{ env.PGVERSION }} crash markers"
            echo '```'
            grep -nE "terminated by signal|server process|reinitializing|TRAP:|Assert|PANIC|was terminated|all server processes terminated" "$SRV" \
              || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          MARKERS=$(grep -E "terminated by signal|TRAP:|PANIC|reinitializing" "$SRV" | tail -6)
          if [ -n "$MARKERS" ]; then
            echo "::error::$(printf '%s\n' "$MARKERS" | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"
          fi
        else
          echo "::error::no server log at $SRV"
        fi
        exit 1
