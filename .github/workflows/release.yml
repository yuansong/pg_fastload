name: Release

# A version tag (v1.2.3) publishes a GitHub release.  The body is
# RELEASE_NOTES_<tag>.md, which lives in the repository next to the code it
# describes, and the tag is checked against include/common.h -- so the version,
# the notes and the documentation cannot drift apart.
#
# The release carries the same three things pg_bulkload publishes for a version:
#   * a source tarball, pg_fastload-<version>.tar.gz, which is exactly the tree
#     rpmbuild consumed (git archive of the tag, prefix pg_fastload-<version>/);
#   * one binary RPM per (PostgreSQL major, RHEL major) pair, named
#     pg_fastload-<version>-1.pg<nn>.rhel<m>.x86_64.rpm;
#   * the notes themselves.
# Every RPM is built inside its target distribution and must pass
# `make installcheck` against the installed package before it is uploaded.
#
# Re-pushing a tag updates the existing release and replaces its assets instead
# of failing.

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  # A re-pushed tag replaces the previous attempt, assets included (every
  # upload uses --clobber).  Not cancelling would leave an older attempt
  # holding the group, and a run that hangs for its whole timeout blocks the
  # newer one behind it -- which is exactly what happened on the first day.
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag and the source version
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          src=$(sed -n 's/.*PG_FASTLOAD_VERSION "\([0-9][0-9.]*\)".*/\1/p' include/common.h | head -n1)
          echo "tag=${tag}"     >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "tag: ${tag} / include/common.h: ${src}"
          if [ -z "${src}" ]; then
            echo "::error::could not read PG_FASTLOAD_VERSION from include/common.h"
            exit 1
          fi
          if [ "${ver}" != "${src}" ]; then
            echo "::error::tag ${tag} does not match include/common.h (${src}); bump the version or fix the tag"
            exit 1
          fi

      - name: Locate the release notes
        id: notes
        run: |
          f="RELEASE_NOTES_${{ steps.ver.outputs.tag }}.md"
          if [ ! -f "$f" ]; then
            echo "::error::$f is missing -- the release body has to ship with the source"
            ls -1 RELEASE_NOTES_*.md 2>/dev/null || true
            exit 1
          fi
          echo "file=${f}" >> "$GITHUB_OUTPUT"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          title="pg_fastload ${{ steps.ver.outputs.version }}"
          notes="${{ steps.notes.outputs.file }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} exists, updating it"
            gh release edit "$tag" --title "$title" --notes-file "$notes"
            # Deleting and re-pushing a tag turns its release into a draft, and
            # `gh release edit` does not publish it again.  Re-publishing is
            # idempotent, so always check.
            rid=$(gh release view "$tag" --json databaseId -q .databaseId)
            draft=$(gh release view "$tag" --json isDraft -q .isDraft)
            if [ "$draft" = "true" ]; then
              echo "release ${tag} was a draft (tag re-created); publishing it"
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${rid}" -F draft=false >/dev/null
            fi
          else
            gh release create "$tag" --title "$title" --notes-file "$notes" --verify-tag
          fi

  source:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the source tarball
        run: |
          ver="${{ needs.release.outputs.version }}"
          git archive --format=tar.gz --prefix="pg_fastload-${ver}/" \
            -o "pg_fastload-${ver}.tar.gz" "${{ github.sha }}"
          sha256sum "pg_fastload-${ver}.tar.gz" > "pg_fastload-${ver}.tar.gz.sha256"
          ls -l "pg_fastload-${ver}.tar.gz"*
          echo "--- top of the archive ---"
          tar -tzf "pg_fastload-${ver}.tar.gz" | head -n 5

      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" pg_fastload-*.tar.gz* --clobber

  rpms:
    needs: release
    runs-on: ubuntu-latest
    # A docker build that hangs on a mirror should fail, not sit in the queue
    # for the six hours the default timeout allows.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # pg_bulkload ships rhel8/9/10 for every supported major.  PostgreSQL 14
      # is absent on purpose: include/pg_fastload.h refuses anything older than
      # 15, so a pg14 package could not exist.
      matrix:
        RHEL_VERSION: ["8", "9", "10"]
        PG_VERSION: ["15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@v4

      - name: Build the PostgreSQL ${{ matrix.PG_VERSION }} RPM for RHEL ${{ matrix.RHEL_VERSION }}
        run: |
          # --progress=plain keeps the RUN output line by line; a job log needs
          # admin rights, so the summary below is where a failure has to be
          # readable.
          docker build .github/workflows/ -t pg_fastload --progress=plain \
            --build-arg RHEL_VERSION=${{ matrix.RHEL_VERSION }} \
            --build-arg PG_VERSION=${{ matrix.PG_VERSION }} \
            --build-arg PG_FASTLOAD_VERSION=${{ needs.release.outputs.version }} \
            --build-arg REPO_URL=${{ github.server_url }}/${{ github.repository }}.git \
            --build-arg GIT_REF=${{ github.ref_name }} 2>&1 | tee /tmp/docker-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "### pg${{ matrix.PG_VERSION }} / rhel${{ matrix.RHEL_VERSION }}: docker build failed (rc=$rc)"
              echo '```'
              tail -n 160 /tmp/docker-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # The summary renders on the job page, which needs a browser login;
            # annotations are readable from the public API, so the interesting
            # lines go there too.  One annotation, because GitHub keeps only a
            # handful per step.
            msg=$(grep -inE 'not ok|regression|diff|error|fatal|panic|failed|cannot|no match|no space' \
                    /tmp/docker-build.log | tail -n 40 \
                    | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')
            echo "::error::${msg}"
            exit "$rc"
          fi
          container_id=$(docker create pg_fastload)
          docker cp "$container_id":/var/lib/pgsql/rpmbuild/RPMS/x86_64 ./RPMS
          docker rm "$container_id"
          ls -l RPMS

      - name: Attach the RPM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" ./RPMS/*.rpm --clobber
