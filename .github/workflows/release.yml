name: Release

# A version tag (v1.2.3) publishes a GitHub release.  The body is
# RELEASE_NOTES_<tag>.md, which lives in the repository next to the code it
# describes, and the tag is checked against include/common.h — so the version,
# the notes and the documentation cannot drift apart.
#
# Re-pushing a tag updates the existing release instead of failing.

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag and the source version
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          src=$(sed -n 's/.*PG_FASTLOAD_VERSION "\([0-9][0-9.]*\)".*/\1/p' include/common.h | head -n1)
          echo "tag=${tag}"     >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "source=${src}"  >> "$GITHUB_OUTPUT"
          echo "tag: ${tag} / include/common.h: ${src}"
          if [ -z "${src}" ]; then
            echo "::error::could not read PG_FASTLOAD_VERSION from include/common.h"
            exit 1
          fi
          if [ "${ver}" != "${src}" ]; then
            echo "::error::tag ${tag} does not match include/common.h (${src}); bump the version or fix the tag"
            exit 1
          fi

      - name: Locate the release notes
        id: notes
        run: |
          f="RELEASE_NOTES_${{ steps.ver.outputs.tag }}.md"
          if [ ! -f "$f" ]; then
            echo "::error::$f is missing — the release body has to ship with the source"
            ls -1 RELEASE_NOTES_*.md 2>/dev/null || true
            exit 1
          fi
          echo "file=${f}" >> "$GITHUB_OUTPUT"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          title="pg_fastload ${{ steps.ver.outputs.version }}"
          notes="${{ steps.notes.outputs.file }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} exists, updating it"
            gh release edit "$tag" --title "$title" --notes-file "$notes"
            # Deleting and re-pushing a tag turns its release into a draft, and
            # `gh release edit` does not publish it again.  Re-publishing is
            # idempotent, so always check.
            rid=$(gh release view "$tag" --json databaseId -q .databaseId)
            draft=$(gh release view "$tag" --json isDraft -q .isDraft)
            if [ "$draft" = "true" ]; then
              echo "release ${tag} was a draft (tag re-created); publishing it"
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${rid}" -F draft=false >/dev/null
            fi
          else
            gh release create "$tag" --title "$title" --notes-file "$notes" --verify-tag
          fi
